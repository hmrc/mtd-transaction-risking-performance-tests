testData {
    normal = "data/local.csv"
    noFeedback = "data/no-feedback.csv"
    consumerB = "data/private-consumer-b.csv"
}

# workload.scala calculates forecast journers/second
# load=1 retains each calculated rate
# perftest.loadPercentage scales the entire workload
journeys {
    year-one-actionable {
        description = "Year 1 feedback and acknowledgement"
        load = 1
        feeder = ${testData.normal}
        parts = [prepare, feedback, acknowledge]
        run-if = [year-one-peak]
    }

    year-one-no-feedback {
        description = "Year 1 no feedback"
        load = 1
        feeder = ${testData.noFeedback}
        parts = [prepare, no-feedback]
        run-if = [year-one-peak]
    }

    mature-actionable = ${journeys.year-one-actionable} {
        run-if = [mature-peak]
    }

    mature-no-feedback = ${journeys.year-one-no-feedback} {
        run-if = [mature-peak]
    }

    soak-actionable = ${journeys.year-one-actionable} {
        run-if = [soak]
    }

    soak-no-feedback = ${journeys.year-one-no-feedback} {
        run-if = [soak]
    }

    spike-actionable = ${journeys.year-one-actionable} {
        run-if = [spike]
    }

    spike-no-feedback = ${journeys.year-one-no-feedback} {
        run-if = [spike]
    }

    capacity-actionable = ${journeys.year-one-actionable} {
        run-if = [spike]
    }

    capacity-no-feedback = ${journeys.year-one-no-feedback} {
        run-if = [spike]
    }

    consumer-a {
        description = "Application A quota"
        load = 1
        feeder = {testData.normal}
        parts = [prepare, feedback]
        run-if = [consumer-limits]
    }

    consumer-b {
        description = "Application B quota"
        load = 1
        feeder = {testData.consumerB}
        parts = [prepare-b, feedback]
        run-if = [consumer-limits]
    }

    downstream {
        description = "Controlled RDS quota"
        load = 1
        feeder = ${testData.normal}
        parts = [prepare, feedback]
        run-if = [downstream-limits]
    }
}
