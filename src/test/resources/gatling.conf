#########################
# Gatling Configuration #
#########################

# This file contains all the settings configurable for Gatling with their default values
# This file is specific to gatling-charts-highcharts 3.4.2 and is available under conf directory of
# https://repo1.maven.org/maven2/io/gatling/highcharts/gatling-charts-highcharts-bundle/3.4.2/

gatling {
    http {
        warmUpUrl = ""
        requestTimeout = 10000
        enableHostnameVerification = true
    }

    ssl.useInsecureTrustManager = false

    data.writers = [console, file]
    data.enableAnalytics = false

    charting.indicators {
        percentile1 = 50
        percentile2 = 90
        percentile3 = 95
        percentile4 = 99
    }
}