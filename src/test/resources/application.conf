# Configures the test to run locally. The default value is true.
# When true, services-local.conf file is used. When false, services.conf is used
#runLocal = false

perftest {

  labels = "year-one-peak"

  # HMRC durations are minutes
  # rampupTime = 1
  # constantRateTime = 5
  # rampdownTime = 1

  # Soak defaults to a 240-minute constant phase unless overrriden
  # loadPercentage = 100
  # runSmokeTest = false

  percentageFailureThreshold = 1
  requestPercentageFailureThreshold = 1
}

api {
  # acceptance thresholds
  p95Ms = 1000
  p99MS = 2000
  timeoutSeconds = 10
  windowSeconds = 30

  annualReturns = 9200000
  yearOneUptake = 0.51
  matureUptake = 0.67
  feedbackFraction = 0.10
  feedbackIterations = 3

  # Conservative assumption: 90% of feedback requests have no feedback
  # set to 1 if the other 90% of customers each make one request
  noFeedbackIterations = 3

  peakMonthFraction = 0.70
  peakWindowHours = 4

  # Forecast used by soak, spike and capacity
  demand = "mature"

  # remote runs must explicity declare their topology
  # topology = "integrated"
  # auth = true
  # pathPrefix = '/organisations/vat-assist'
}
